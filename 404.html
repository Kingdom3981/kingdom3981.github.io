// Discover the nearest real homepage even on nested project-site errors.
(async () => {
  let base = new URL('.', location.href);
  document.getElementById('home').href = new URL('index.html', base).href;
  for (let depth=0; depth<20; depth++) {
    try {
      const candidate = new URL('index.html', base);
      const response = await fetch(candidate, {cache:'no-store'});
      if (response.ok && (await response.text()).includes('data-page="Home"')) {
        document.getElementById('home').href = candidate.href; return;
      }
    } catch (_) { return; }
    const parent = new URL('../',base); if(parent.href===base.href) return; base=parent;
  }
})();
